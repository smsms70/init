services:
  init:
    container_name: init
    build: 
      context: .
    # image: hefrenz/init:latest
    ports:
    - "8080:8080"
    environment:
      - ADMIN_PASSWORD=password #set here a custom password
      - ADMIN_USER=admin #default user, can't change it right now
    volumes:
      - db-data:/app/data

volumes:
  db-data:
